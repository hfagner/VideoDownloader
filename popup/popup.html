<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Edge Video Downloader</title>
  <link rel="stylesheet" href="popup.css">
  <script src="../libs/storage.js"></script>
  <script src="../libs/messaging.js"></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="../icons/icon-active-32.png" alt="Logo">
      <h1>Edge Video Downloader</h1>
    </div>
    <div class="actions">
      <button id="btn-sidebar" title="Abrir como Sidebar" class="icon-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
      </button>
      <button id="btn-settings" title="Configurações" class="icon-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="advanced-download-section" class="card" style="display: none; padding: 12px; margin-bottom: 12px; border: 1px solid var(--accent); background-color: var(--accent-light); border-radius: var(--radius-md);">
      <h3 style="font-size: 13px; margin-bottom: 8px;">🚀 Download Avançado</h3>
      <p style="font-size: 11px; color: var(--text-secondary); margin-bottom: 10px;">Modo de alta performance para YouTube e Hotmart usando o Motor Local.</p>
      <div style="margin-bottom: 8px;">
        <select id="advanced-format" style="width: 100%; padding: 6px; font-size: 11px; border: 1px solid var(--accent); border-radius: 4px; background: #fff; color: #333;">
          <option value="video">Vídeo (Completo: Vídeo + Áudio)</option>
          <option value="audio">Apenas Áudio (MP3)</option>
        </select>
      </div>
      <button id="btn-advanced" class="btn-primary" style="width: 100%;">Baixar via Motor Local</button>
      <div id="advanced-progress" style="font-size: 11px; margin-top: 8px; font-weight: bold; text-align: center;"></div>
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
      <p>Nenhuma mídia suportada foi detectada nesta página.</p>
      <a href="#" id="help-link">Ajuda & Solução de Problemas</a>
    </div>

    <div id="media-list" class="media-list">
      <!-- Media cards will be injected here -->
    </div>

    <section id="active-downloads-section" style="display: none;">
      <h3 style="font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px;">⏳ Downloads em andamento</h3>
      <div id="active-downloads-list"></div>
    </section>
  </main>

  <section class="history-section">
    <div class="history-header" id="history-toggle">
      <span>📥 Downloads Recentes</span>
      <span class="chevron">▾</span>
    </div>
    <div id="history-list" class="history-list collapsed">
      <!-- History items will be injected here -->
    </div>
  </section>

  <footer class="footer">
    <button id="btn-open-folder" class="btn-text">📂 Abrir Pasta</button>
    <button id="btn-clear-history" class="btn-text">🧹 Limpar</button>
  </footer>

  <!-- Template for media card -->
  <template id="media-card-template">
    <div class="media-card">
      <div class="media-header">
        <div class="media-icon">🎥</div>
        <div class="media-name-container">
          <input type="text" class="media-filename" spellcheck="false" title="Clique para renomear">
          <span class="edit-icon">✏️</span>
        </div>
      </div>
      <div class="media-info">
        <span class="media-meta format-meta"></span>
        <span class="media-meta size-meta"></span>
      </div>
      <div class="media-actions">
        <select class="format-select" style="padding: 4px 6px; font-size: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; color: #333; max-width: 90px;">
          <option value="video">🎬 Vídeo</option>
          <option value="audio">🎵 Áudio</option>
        </select>
        <button class="btn-primary btn-download">⬇ Download</button>
        <button class="btn-secondary btn-more" title="Mais Opções">⋮</button>
      </div>
      <!-- Context menu para "Mais Opções" -->
      <div class="more-menu" style="display:none;">
        <button class="menu-item btn-copy-url">Copiar URL</button>
        <button class="menu-item btn-copy-page">Copiar URL da Página</button>
        <button class="menu-item btn-blacklist">Não detectar neste site</button>
      </div>
    </div>
  </template>
</body>
</html>
